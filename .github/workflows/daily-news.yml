name: Publish and Check Content
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/**', 'index.html', 'automation/**', 'tests/**', 'assets/**', '.github/workflows/daily-news.yml']
  schedule:
    - cron: '15 1,7,13 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: guanchao-content-and-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test content utilities
        run: python -m unittest discover -s tests -v
      - name: Check actual content dates without generating or changing articles
        run: python automation/check_content_status.py
      - name: Save status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/update-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Check actual content freshness'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Prepare website
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -R data dist/
          if [ -d assets ]; then cp -R assets dist/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
