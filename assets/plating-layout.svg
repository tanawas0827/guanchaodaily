<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img"><title>家庭摆盘示意</title><rect width="960" height="520" fill="#f6f3eb"/><g font-family="system-ui,'Microsoft YaHei',sans-serif" fill="#203b38"><text x="42" y="58" font-size="32" font-weight="700">摆盘先看重点，也要方便吃</text><ellipse cx="375" cy="285" rx="270" ry="180" fill="#fffdf8" stroke="#c3cdc1" stroke-width="5"/><ellipse cx="345" cy="273" rx="108" ry="56" fill="#d6a374" transform="rotate(-16 345 273)"/><circle cx="470" cy="337" r="30" fill="#7d9a65"/><circle cx="426" cy="355" r="24" fill="#92ac78"/><path d="M236 340 Q290 375 340 347" fill="none" stroke="#b3a075" stroke-width="13" stroke-linecap="round"/><path d="M455 225 L660 172 M487 338 L660 295 M285 350 L660 402" fill="none" stroke="#6e8074" stroke-width="2"/><text x="668" y="177" font-size="24">主菜：明确视觉重点</text><text x="668" y="300" font-size="24">配菜：与主菜有关系</text><text x="668" y="407" font-size="24">酱汁：少量、按需补加</text><text x="42" y="489" font-size="17" fill="#7a8176">观潮原创示意图 · 不表示实际食材比例或具体菜谱成品 · 留白不是减少到吃不饱</text></g></svg>