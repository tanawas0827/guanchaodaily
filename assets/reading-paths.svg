<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img"><title>本月选书：先看自己想怎样读</title><g font-family="system-ui,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect width="960" height="510" fill="#f6f3eb"/><text x="48" y="68" font-size="34" font-weight="700" fill="#203b38">本月选书：先看自己想怎样读</text><text x="48" y="106" font-size="19" fill="#64746a">不是一次买三本，而是挑一个阅读入口</text><rect x="48" y="150" width="416" height="124" rx="18" fill="#dbe7df"/><text x="70" y="189" font-size="24" font-weight="600" fill="#203b38">想跟着完整故事走</text><text x="70" y="226" font-size="19" fill="#40544a">《边城》：人物与含蓄情感</text><text x="70" y="255" font-size="18" fill="#40544a">留意景物、节奏和未尽之言</text><rect x="496" y="150" width="416" height="124" rx="18" fill="#e9dfcb"/><text x="518" y="189" font-size="24" font-weight="600" fill="#203b38">想从独立短篇进入</text><text x="518" y="226" font-size="19" fill="#40544a">汪曾祺小说选：日常细节</text><text x="518" y="255" font-size="18" fill="#40544a">按目录核对实际篇目</text><rect x="48" y="298" width="416" height="124" rx="18" fill="#e5dce5"/><text x="70" y="337" font-size="24" font-weight="600" fill="#203b38">想慢读散文与思考</text><text x="70" y="374" font-size="19" fill="#40544a">《我与地坛》：经验与追问</text><text x="70" y="403" font-size="18" fill="#40544a">关注不同同名选集的内容</text><rect x="496" y="298" width="416" height="124" rx="18" fill="#d9e4eb"/><text x="518" y="337" font-size="24" font-weight="600" fill="#203b38">购买前再确认</text><text x="518" y="374" font-size="19" fill="#40544a">原作、目录、排版与版本</text><text x="518" y="403" font-size="18" fill="#40544a">不以封面或厚度代替核对</text><text x="48" y="486" font-size="16" fill="#7a8176">观潮 · 原创教学示意图 ｜ 不是实拍或实测数据</text></g></svg>