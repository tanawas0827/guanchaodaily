<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img"><title>一荤一素菜单：先备料，再看火</title><g font-family="system-ui,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect width="960" height="510" fill="#f6f3eb"/><text x="48" y="68" font-size="34" font-weight="700" fill="#203b38">一荤一素菜单：先备料，再看火</text><text x="48" y="106" font-size="19" fill="#64746a">五项菜单的顺序练习，不是固定烹调时长</text><rect x="48" y="150" width="416" height="124" rx="18" fill="#dbe7df"/><text x="70" y="189" font-size="24" font-weight="600" fill="#203b38">先做冷食</text><text x="70" y="226" font-size="19" fill="#40544a">清洗蔬果，准备甜点</text><text x="70" y="255" font-size="18" fill="#40544a">按需冷藏，临吃再拌前菜</text><rect x="496" y="150" width="416" height="124" rx="18" fill="#e9dfcb"/><text x="518" y="189" font-size="24" font-weight="600" fill="#203b38">再处理生鱼</text><text x="518" y="226" font-size="19" fill="#40544a">专用刀板，生熟分开</text><text x="518" y="255" font-size="18" fill="#40544a">处理后清洁手与器具</text><rect x="48" y="298" width="416" height="124" rx="18" fill="#e5dce5"/><text x="70" y="337" font-size="24" font-weight="600" fill="#203b38">蔬菜与主菜</text><text x="70" y="374" font-size="19" fill="#40544a">按设备数量逐项烹调</text><text x="70" y="403" font-size="18" fill="#40544a">熟度以可靠判断为准</text><rect x="496" y="298" width="416" height="124" rx="18" fill="#d9e4eb"/><text x="518" y="337" font-size="24" font-weight="600" fill="#203b38">最后上桌</text><text x="518" y="374" font-size="19" fill="#40544a">煎鱼后装盘，最后冲饮料</text><text x="518" y="403" font-size="18" fill="#40544a">及时食用，不为拍照久放</text><text x="48" y="486" font-size="16" fill="#7a8176">观潮 · 原创教学示意图 ｜ 不是实拍或实测数据</text></g></svg>