<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img"><title>酒店背后的四种角色</title><g font-family="system-ui,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect width="960" height="510" fill="#f6f3eb"/><text x="48" y="68" font-size="34" font-weight="700" fill="#203b38">酒店背后的四种角色</text><text x="48" y="106" font-size="19" fill="#64746a">概念关系示意，各酒店实际合同与分工可能不同</text><rect x="48" y="150" width="416" height="124" rx="18" fill="#dbe7df"/><text x="70" y="189" font-size="24" font-weight="600" fill="#203b38">业主</text><text x="70" y="226" font-size="19" fill="#40544a">持有或投资物业等资产</text><text x="70" y="255" font-size="18" fill="#40544a">不一定就是门店品牌</text><rect x="496" y="150" width="416" height="124" rx="18" fill="#e9dfcb"/><text x="518" y="189" font-size="24" font-weight="600" fill="#203b38">品牌</text><text x="518" y="226" font-size="19" fill="#40544a">名称、标准与体系支持</text><text x="518" y="255" font-size="18" fill="#40544a">不等于拥有全部楼宇</text><rect x="48" y="298" width="416" height="124" rx="18" fill="#e5dce5"/><text x="70" y="337" font-size="24" font-weight="600" fill="#203b38">运营管理</text><text x="70" y="374" font-size="19" fill="#40544a">人员、服务与流程协作</text><text x="70" y="403" font-size="18" fill="#40544a">门店岗位彼此配合</text><rect x="496" y="298" width="416" height="124" rx="18" fill="#d9e4eb"/><text x="518" y="337" font-size="24" font-weight="600" fill="#203b38">销售渠道</text><text x="518" y="374" font-size="19" fill="#40544a">直订或其他预订渠道</text><text x="518" y="403" font-size="18" fill="#40544a">价格与条款需要分别核对</text><text x="48" y="486" font-size="16" fill="#7a8176">观潮 · 原创教学示意图 ｜ 不是实拍或实测数据</text></g></svg>