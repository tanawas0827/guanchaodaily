<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img"><title>读数字新闻，先对齐四件事</title><g font-family="system-ui,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect width="960" height="510" fill="#f6f3eb"/><text x="48" y="68" font-size="34" font-weight="700" fill="#203b38">读数字新闻，先对齐四件事</text><text x="48" y="106" font-size="19" fill="#64746a">同一个增长数字，不一定回答同一个问题</text><rect x="48" y="150" width="416" height="124" rx="18" fill="#dbe7df"/><text x="70" y="189" font-size="24" font-weight="600" fill="#203b38">发布日期</text><text x="70" y="226" font-size="19" fill="#40544a">信息什么时候对外公布？</text><text x="70" y="255" font-size="18" fill="#40544a">不要当成事件发生时间</text><rect x="496" y="150" width="416" height="124" rx="18" fill="#e9dfcb"/><text x="518" y="189" font-size="24" font-weight="600" fill="#203b38">数据范围</text><text x="518" y="226" font-size="19" fill="#40544a">描述哪一年、哪段时间？</text><text x="518" y="255" font-size="18" fill="#40544a">历史统计不是即时表现</text><rect x="48" y="298" width="416" height="124" rx="18" fill="#e5dce5"/><text x="70" y="337" font-size="24" font-weight="600" fill="#203b38">地区与样本</text><text x="70" y="374" font-size="19" fill="#40544a">统计包含哪些人或单位？</text><text x="70" y="403" font-size="18" fill="#40544a">个案不等于总体</text><rect x="496" y="298" width="416" height="124" rx="18" fill="#d9e4eb"/><text x="518" y="337" font-size="24" font-weight="600" fill="#203b38">比较基准</text><text x="518" y="374" font-size="19" fill="#40544a">与谁比较，用什么口径？</text><text x="518" y="403" font-size="18" fill="#40544a">结论还需要哪些证据？</text><text x="48" y="486" font-size="16" fill="#7a8176">观潮 · 原创教学示意图 ｜ 不是实拍或实测数据</text></g></svg>