<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img"><title>AI操作之前，先划清边界</title><g font-family="system-ui,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect width="960" height="510" fill="#f6f3eb"/><text x="48" y="68" font-size="34" font-weight="700" fill="#203b38">AI操作之前，先划清边界</text><text x="48" y="106" font-size="19" fill="#64746a">从“它能做什么”到“它获准做什么”</text><rect x="48" y="150" width="416" height="124" rx="18" fill="#dbe7df"/><text x="70" y="189" font-size="24" font-weight="600" fill="#203b38">任务范围</text><text x="70" y="226" font-size="19" fill="#40544a">只打开练习需要的目录</text><text x="70" y="255" font-size="18" fill="#40544a">不交出无关个人资料</text><rect x="496" y="150" width="416" height="124" rx="18" fill="#e9dfcb"/><text x="518" y="189" font-size="24" font-weight="600" fill="#203b38">最小权限</text><text x="518" y="226" font-size="19" fill="#40544a">按需要提供工具与访问</text><text x="518" y="255" font-size="18" fill="#40544a">可写不代表应当写</text><rect x="48" y="298" width="416" height="124" rx="18" fill="#e5dce5"/><text x="70" y="337" font-size="24" font-weight="600" fill="#203b38">检查修改</text><text x="70" y="374" font-size="19" fill="#40544a">保留可运行版本并看差异</text><text x="70" y="403" font-size="18" fill="#40544a">不要只听一句“已完成”</text><rect x="496" y="298" width="416" height="124" rx="18" fill="#d9e4eb"/><text x="518" y="337" font-size="24" font-weight="600" fill="#203b38">运行验证</text><text x="518" y="374" font-size="19" fill="#40544a">用真实测试观察行为</text><text x="518" y="403" font-size="18" fill="#40544a">结果与说明都要核对</text><text x="48" y="486" font-size="16" fill="#7a8176">观潮 · 原创教学示意图 ｜ 不是实拍或实测数据</text></g></svg>