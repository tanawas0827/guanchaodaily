<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img"><title>叠穿的四个观察点</title><g font-family="system-ui,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect width="960" height="510" fill="#f6f3eb"/><text x="48" y="68" font-size="34" font-weight="700" fill="#203b38">叠穿的四个观察点</text><text x="48" y="106" font-size="19" fill="#64746a">使用已有衣物，先试穿再决定是否购买</text><rect x="48" y="150" width="416" height="124" rx="18" fill="#dbe7df"/><text x="70" y="189" font-size="24" font-weight="600" fill="#203b38">轮廓</text><text x="70" y="226" font-size="19" fill="#40544a">坐下、抬手、背包试一次</text><text x="70" y="255" font-size="18" fill="#40544a">活动顺畅比固定尺码更重要</text><rect x="496" y="150" width="416" height="124" rx="18" fill="#e9dfcb"/><text x="518" y="189" font-size="24" font-weight="600" fill="#203b38">配色</text><text x="518" y="226" font-size="19" fill="#40544a">浅色内搭＋深色外层</text><text x="518" y="255" font-size="18" fill="#40544a">这是练习，不是唯一规则</text><rect x="48" y="298" width="416" height="124" rx="18" fill="#e5dce5"/><text x="70" y="337" font-size="24" font-weight="600" fill="#203b38">层次</text><text x="70" y="374" font-size="19" fill="#40544a">衣领与袖口不要互相拉扯</text><text x="70" y="403" font-size="18" fill="#40544a">按天气与活动量增减</text><rect x="496" y="298" width="416" height="124" rx="18" fill="#d9e4eb"/><text x="518" y="337" font-size="24" font-weight="600" fill="#203b38">护理</text><text x="518" y="374" font-size="19" fill="#40544a">先看实际洗护标签</text><text x="518" y="403" font-size="18" fill="#40544a">针织不等于同一种纤维</text><text x="48" y="486" font-size="16" fill="#7a8176">观潮 · 原创教学示意图 ｜ 不是实拍或实测数据</text></g></svg>