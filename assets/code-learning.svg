<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img"><title>本周工具学习：按问题选择工具</title><g font-family="system-ui,'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><rect width="960" height="510" fill="#f6f3eb"/><text x="48" y="68" font-size="34" font-weight="700" fill="#203b38">本周工具学习：按问题选择工具</text><text x="48" y="106" font-size="19" fill="#64746a">编辑精选，不代表GitHub趋势排名</text><rect x="48" y="150" width="416" height="124" rx="18" fill="#dbe7df"/><text x="70" y="189" font-size="24" font-weight="600" fill="#203b38">先保留历史</text><text x="70" y="226" font-size="19" fill="#40544a">Git：解释一次改动</text><text x="70" y="255" font-size="18" fill="#40544a">看差异，能够回到旧版本</text><rect x="496" y="150" width="416" height="124" rx="18" fill="#e9dfcb"/><text x="518" y="189" font-size="24" font-weight="600" fill="#203b38">再读懂代码</text><text x="518" y="226" font-size="19" fill="#40544a">C算法：跟踪一组输入</text><text x="518" y="255" font-size="18" fill="#40544a">检查边界，不只复制</text><rect x="48" y="298" width="416" height="124" rx="18" fill="#e5dce5"/><text x="70" y="337" font-size="24" font-weight="600" fill="#203b38">需要时检索</text><text x="70" y="374" font-size="19" fill="#40544a">ripgrep / fd：内容与文件</text><text x="70" y="403" font-size="18" fill="#40544a">区分搜文字和找文件</text><rect x="496" y="298" width="416" height="124" rx="18" fill="#d9e4eb"/><text x="518" y="337" font-size="24" font-weight="600" fill="#203b38">进阶再探索</text><text x="518" y="374" font-size="19" fill="#40544a">编译器、Python、模型工具</text><text x="518" y="403" font-size="18" fill="#40544a">核对环境、授权与费用</text><text x="48" y="486" font-size="16" fill="#7a8176">观潮 · 原创教学示意图 ｜ 不是实拍或实测数据</text></g></svg>